name: Publish Backend

on:
  push:
    branches: [ develop ]

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bump version
        id: version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git add pom.xml
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: paulwoods/equipment-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on remote; skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          if ! git push origin "v${VERSION}" 2>push.err; then
            if grep -q "already exists" push.err; then
              echo "Tag v${VERSION} was created concurrently by another workflow; treating as success."
              exit 0
            fi
            cat push.err >&2
            exit 1
          fi

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}

    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-auth-sock: /tmp/ssh-auth.sock
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Back up database on droplet
        run: |
          ssh "$DROPLET_USER@$DROPLET_HOST" bash -s <<'EOF'
          set -euo pipefail
          ~/equipment/backup.sh
          EOF

      - name: Deploy backend on droplet
        run: |
          ssh "$DROPLET_USER@$DROPLET_HOST" VERSION="$VERSION" bash -s <<'EOF'
          set -euo pipefail
          cd ~/equipment
          sed -i "s|paulwoods/equipment-backend:.*|paulwoods/equipment-backend:${VERSION}|" docker-compose.yml
          docker compose pull backend
          docker compose up -d --no-deps backend
          docker compose ps backend
          EOF

      - name: Wait for backend health
        run: |
          ssh "$DROPLET_USER@$DROPLET_HOST" bash -s <<'EOF'
          set -euo pipefail
          cd ~/equipment
          for i in $(seq 1 30); do
            if docker compose exec -T backend wget -qO- --tries=1 --timeout=2 \
                http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Backend healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}: backend not yet healthy, retrying in 2s..."
            sleep 2
          done
          echo "Backend did not report UP within 60s" >&2
          docker compose logs --tail=100 backend >&2 || true
          exit 1
          EOF
