
spring:
  application:
    name: equipment
  datasource:
    url: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
  flyway:
    enabled: true
    url: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt-secret: ${APP_JWT_SECRET}
  jwt-expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  smtp-user: ${APP_SMTP_USER}
  smtp-pass: ${APP_SMTP_PASS}
  smtp-from: ${APP_SMTP_FROM}

scheduling:
  enabled: true
