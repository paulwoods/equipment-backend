
spring:
  application:
    name: equipment-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.woods.local:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.woods.local:5432/postgres}
    user: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt-secret: ${APP_JWT_SECRET:changeme-use-a-32-char-secret-here!!}
  jwt-expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  smtp-user: ${APP_SMTP_USER:}
  smtp-pass: ${APP_SMTP_PASS:}
  smtp-from: ${APP_SMTP_FROM:"Equipment Management <noreply@example.com>"}
  app-url: ${APP_URL:http://localhost:8080}
  email-recipient: ${APP_EMAIL_RECIPIENT:mr.paul.woods@gmail.com}

scheduling:
  enabled: true
