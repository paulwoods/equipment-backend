server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    url: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  application:
    name: equipment
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt-secret: ${APP_JWT_SECRET}
  smtp-from: no-reply@dev.local
  app-url: http://localhost:8080
  cookie-secure: false
  jwt-expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  login-max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
  login-lockout-duration-ms: ${APP_LOGIN_LOCKOUT_DURATION_MS:900000}

scheduling:
  enabled: true
