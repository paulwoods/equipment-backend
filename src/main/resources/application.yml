server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  flyway:
    url: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  application:
    name: equipment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt-secret: ${APP_JWT_SECRET}
  smtp-from: no-reply@dev.local
  app-url: ${APP_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  jwt-expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  login-max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
  login-lockout-duration-ms: ${APP_LOGIN_LOCKOUT_DURATION_MS:900000}
  forgot-password-max-attempts: ${APP_FORGOT_PASSWORD_MAX_ATTEMPTS:3}
  forgot-password-window-ms: ${APP_FORGOT_PASSWORD_WINDOW_MS:3600000}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

scheduling:
  enabled: true
